<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1525">
<title>오늘 점심은 누가? · 점심내기 룰렛</title>
<style>
:root{color-scheme:dark;--bg:#0e1525;--panel:#192237;--panel2:#202b43;--text:#f5f7ff;--muted:#9ba9c0;--line:#33415a;--pink:#ff6f91;--yellow:#ffca69;--mint:#5be2cb;--blue:#84aaff;--shadow:0 22px 70px #0005}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#263457 0,transparent 38%),radial-gradient(circle at 90% 15%,#342642 0,transparent 35%),var(--bg);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--text)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.wrap{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:44px 0 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:28px}.eyebrow{display:inline-flex;align-items:center;gap:7px;background:#ffffff10;border:1px solid #ffffff17;border-radius:100px;padding:7px 12px;color:#d6def2;font-size:12px;font-weight:750;letter-spacing:.08em}.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px #5be2cb1c}.top h1{font-size:clamp(30px,4.5vw,52px);letter-spacing:-.055em;margin:15px 0 7px;line-height:1.15}.top h1 span{color:var(--yellow)}.top p{font-size:15px;color:var(--muted);margin:0;line-height:1.6}.small-btn{background:#ffffff0e;border:1px solid var(--line);color:#e7edfa;border-radius:12px;padding:10px 13px;font-weight:700;white-space:nowrap}.small-btn:hover{background:#ffffff20}.layout{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(320px,.9fr);gap:22px;align-items:start}.card{background:linear-gradient(155deg,#202a40,#151e30);border:1px solid #ffffff13;border-radius:25px;box-shadow:var(--shadow)}.wheel-card{padding:25px 25px 26px}.section-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.label{font-size:13px;font-weight:800;color:#9ba9c0;letter-spacing:.04em}.count{background:#ffffff12;padding:7px 11px;border-radius:10px;font-size:12px;color:#c5d2e8}.wheel-area{position:relative;width:min(100%,510px);aspect-ratio:1;margin:7px auto 0;display:grid;place-items:center}.wheel-area:before{content:"";position:absolute;inset:8%;border-radius:50%;background:#ffca6912;filter:blur(28px)}#wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 16px 22px #0006)}.pointer{position:absolute;z-index:5;top:-1%;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid #fff2d3;filter:drop-shadow(0 3px 4px #0008)}.wheel-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:#f8fbff;box-shadow:0 0 0 8px #ffffff28,0 5px 20px #0007;display:grid;place-items:center;color:#182237;font-size:27px;pointer-events:none}.spin{width:100%;border:0;border-radius:16px;padding:17px 18px;background:linear-gradient(110deg,#ffce69,#ff956c);color:#252034;font-weight:900;font-size:18px;letter-spacing:-.03em;box-shadow:0 8px 24px #ff9d5e2d;transition:transform .15s,filter .15s}.spin:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}.spin:active:not(:disabled){transform:translateY(1px)}.hint{text-align:center;font-size:12px;color:var(--muted);margin:13px 0 0}.side{display:grid;gap:20px}.side .card{padding:22px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.heading h2{font-size:19px;letter-spacing:-.04em;margin:0}.tag{background:#5be2cb1a;color:#7af5df;border:1px solid #5be2cb33;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:800}.entry{display:flex;gap:9px}.entry input{flex:1;min-width:0;outline:0;background:#0d1626;border:1px solid #38465d;color:#fff;padding:13px 14px;border-radius:11px}.entry input:focus{border-color:var(--mint);box-shadow:0 0 0 3px #5be2cb15}.add{background:var(--mint);color:#102b33;border:0;border-radius:11px;padding:0 18px;font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;min-height:42px}.chip{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 10px 10px 12px;background:#ffffff0f;border:1px solid #ffffff15;color:#e8edfa;font-weight:700;font-size:13px}.chip button{background:none;border:0;color:#9faec6;padding:0 1px;font-size:20px;line-height:14px}.chip button:hover{color:#ff8ca2}.helper{font-size:12px;color:var(--muted);margin:13px 0 0}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.tool{background:#ffffff0d;border:1px solid var(--line);border-radius:10px;color:#d1dbeb;padding:9px 11px;font-size:12px;font-weight:750}.tool:hover{background:#ffffff1b}.result{position:relative;overflow:hidden;background:linear-gradient(120deg,#302a40,#212b41);border:1px solid #ffca6938}.result:before{content:"";position:absolute;width:220px;height:220px;right:-110px;top:-130px;border-radius:50%;background:#ffca6924;filter:blur(24px)}.result .label{color:#e3c7ac}.result-name{position:relative;font-size:clamp(25px,3.5vw,36px);font-weight:950;letter-spacing:-.05em;margin:11px 0 6px;overflow-wrap:anywhere}.result-desc{position:relative;color:#c0b8c5;font-size:13px;margin:0;line-height:1.5}.history{display:grid;gap:9px;max-height:235px;overflow-y:auto}.history-item{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#ffffff09;border-radius:10px;padding:11px 12px;font-size:13px}.history-item strong{color:#ffe3a2}.history-item time{color:#93a2ba;font-size:11px;white-space:nowrap}.empty{color:#8d9ab2;font-size:13px;padding:12px 0}.footer{text-align:center;color:#6e7e9a;font-size:12px;margin-top:28px}.toast{position:fixed;z-index:100;bottom:28px;left:50%;transform:translate(-50%,30px);padding:12px 18px;background:#eef5ff;color:#1b2740;border-radius:12px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 35px #0007}.toast.show{transform:translate(-50%,0);opacity:1}.confetti{position:fixed;left:0;top:0;pointer-events:none;z-index:80;width:100%;height:100%}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:840px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr;align-items:start}.people-card{grid-column:1/-1}.wheel-area{max-width:500px}}@media(max-width:580px){.wrap{width:calc(100% - 24px);padding:25px 0 35px}.top{margin-bottom:20px}.top h1{font-size:34px}.top p{font-size:13px}.small-btn{font-size:12px;padding:9px}.wheel-card{padding:16px 15px 20px}.wheel-area{margin-top:10px}.pointer{border-left-width:13px;border-right-width:13px;border-top-width:29px}.wheel-center{width:55px;height:55px;font-size:22px}.side{grid-template-columns:1fr;gap:14px}.people-card{grid-column:auto}.side .card{padding:19px}.footer{line-height:1.6}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div><div class="eyebrow"><i></i> LUNCH RANDOM PICKER</div><h1>오늘 점심은 <span>누가?</span> 🍱</h1><p>이름 넣고 룰렛 한 번! 오늘의 점심 계산 담당을 정해보세요.</p></div><button class="small-btn" id="soundBtn" type="button" aria-pressed="true">🔊 효과음 켜짐</button></header>
  <div class="layout">
    <section class="card wheel-card" aria-label="점심내기 룰렛"><div class="section-top"><span class="label">🎯 행운의 룰렛</span><span id="wheelCount" class="count">4명 참가 중</span></div><div class="wheel-area"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="840" height="840" aria-label="참가자 이름이 있는 룰렛"></canvas><div class="wheel-center" aria-hidden="true">🍽️</div></div><button class="spin" id="spinBtn" type="button">🎲 룰렛 돌리기</button><p class="hint">모든 참가자는 동일한 확률로 선택됩니다.</p></section>
    <div class="side">
      <section class="card people-card"><div class="heading"><h2>👥 참가자 관리</h2><span id="personCount" class="tag">4명</span></div><form id="addForm" class="entry"><label for="nameInput" class="sr-only">참가자 이름</label><input id="nameInput" type="text" placeholder="이름 입력 (예: 민수)" maxlength="20" autocomplete="off"><button class="add" type="submit">추가</button></form><div id="chips" class="chips" aria-live="polite"></div><p class="helper">2명 이상 등록하면 룰렛을 돌릴 수 있어요. 최대 30명.</p><div class="tools"><button class="tool" id="sampleBtn" type="button">↻ 예시 명단</button><button class="tool" id="clearBtn" type="button">✕ 전체 삭제</button></div></section>
      <section class="card result" aria-live="polite" aria-atomic="true"><div class="label">🏆 오늘의 계산 담당</div><div id="resultName" class="result-name">누가 걸릴까요?</div><p id="resultDesc" class="result-desc">룰렛을 돌리면 결과가 여기에 표시돼요.</p></section>
      <section class="card"><div class="heading"><h2>🕒 최근 추첨 기록</h2><button class="tool" id="historyClear" type="button">기록 지우기</button></div><div id="history" class="history" aria-live="polite"></div></section>
    </div>
  </div>
  <div class="footer">💡 재미로 즐기는 점심내기! 실제 결제는 당사자끼리 합의해 주세요. · 명단과 기록은 이 브라우저에만 저장됩니다.</div>
</main>
<canvas id="confetti" class="confetti" aria-hidden="true"></canvas><div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),colors=['#ff7f99','#ffbb68','#56d6c4','#7b9df4','#c48cf4','#fa9e73','#65b8df','#a8d477','#ea83c0','#e2ad64'];
const storageKey='lunch-roulette-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch(e){}
let names=Array.isArray(saved.names)?saved.names.filter(x=>typeof x==='string'&&x.trim()).slice(0,30):['민수','지은','현우','수진'];let history=Array.isArray(saved.history)?saved.history.slice(0,15):[];let sound=saved.sound!==false,spinning=false,rotation=0,toastTimer;
const cvs=$('wheel'),ctx=cvs.getContext('2d'),W=cvs.width,C=W/2,R=350;
function save(){try{localStorage.setItem(storageKey,JSON.stringify({names,history,sound}))}catch(e){}}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function safeText(t){return String(t)}
function fitText(t,n){return t.length>n?t.slice(0,n-1)+'…':t}
function draw(angle=rotation){ctx.clearRect(0,0,W,W);ctx.save();ctx.translate(C,C);ctx.rotate(angle);let n=names.length;
ctx.beginPath();ctx.arc(0,0,R+20,0,Math.PI*2);ctx.fillStyle='#ffffff15';ctx.fill();
if(!n){ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fillStyle='#29364d';ctx.fill();ctx.fillStyle='#9ba9c0';ctx.font='bold 35px sans-serif';ctx.textAlign='center';ctx.fillText('참가자를 추가해 주세요',0,-90)}else{
const step=Math.PI*2/n;for(let i=0;i<n;i++){let a=-Math.PI/2-step/2+i*step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a,a+step);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#ffffffad';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.rotate(-Math.PI/2+i*step);ctx.translate(R*.66,0);ctx.rotate(Math.PI/2);ctx.fillStyle='#1e2535';ctx.textAlign='center';ctx.textBaseline='middle';let f=Math.min(34,Math.max(13,210/n));ctx.font=`900 ${f}px "Malgun Gothic",sans-serif`;ctx.fillText(fitText(names[i],n>12?5:9),0,0,n>15?80:155);ctx.restore()}}
ctx.beginPath();ctx.arc(0,0,R+3,0,Math.PI*2);ctx.strokeStyle='#f8f1dd';ctx.lineWidth=15;ctx.stroke();for(let i=0;i<24;i++){let a=2*Math.PI*i/24;ctx.beginPath();ctx.arc(Math.cos(a)*(R+2),Math.sin(a)*(R+2),4.3,0,Math.PI*2);ctx.fillStyle='#fff9e7';ctx.fill()}ctx.restore()}
function renderNames(){const chips=$('chips');chips.replaceChildren();names.forEach((name,i)=>{const el=document.createElement('span');el.className='chip';const label=document.createElement('span');label.textContent=name;const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label',`${name} 삭제`);b.disabled=spinning;b.addEventListener('click',()=>{if(spinning)return;names.splice(i,1);resetResult();refresh()});el.append(label,b);chips.append(el)});$('personCount').textContent=names.length+'명';$('wheelCount').textContent=names.length+'명 참가 중';$('spinBtn').disabled=names.length<2||spinning;$('addForm').querySelector('button').disabled=spinning;$('nameInput').disabled=spinning;$('sampleBtn').disabled=spinning;$('clearBtn').disabled=spinning}
function renderHistory(){const h=$('history');h.replaceChildren();if(!history.length){const e=document.createElement('div');e.className='empty';e.textContent='아직 추첨 기록이 없어요.';h.append(e);return}history.forEach(x=>{const el=document.createElement('div');el.className='history-item';const l=document.createElement('span');l.textContent='🍱 '+x.name;const r=document.createElement('time');r.textContent=x.date;el.append(l,r);h.append(el)})}
function resetResult(){$('resultName').textContent='누가 걸릴까요?';$('resultDesc').textContent='룰렛을 돌리면 결과가 여기에 표시돼요.'}
function refresh(){draw();renderNames();renderHistory();save()}
$('addForm').addEventListener('submit',e=>{e.preventDefault();if(spinning)return;let name=$('nameInput').value.trim().replace(/\s+/g,' ');if(!name){toast('이름을 입력해 주세요.');return}if(names.length>=30){toast('참가자는 최대 30명까지 가능합니다.');return}if(names.some(x=>x.toLocaleLowerCase()===name.toLocaleLowerCase())){toast('이미 등록된 이름이에요.');return}names.push(name);$('nameInput').value='';resetResult();refresh();$('nameInput').focus()});
$('sampleBtn').addEventListener('click',()=>{if(spinning)return;names=['민수','지은','현우','수진'];resetResult();refresh();toast('예시 명단으로 바꿨어요.')});
$('clearBtn').addEventListener('click',()=>{if(spinning)return;if(names.length&&!confirm('참가자를 모두 삭제할까요?'))return;names=[];resetResult();refresh()});
$('historyClear').addEventListener('click',()=>{if(!history.length)return;history=[];renderHistory();save();toast('추첨 기록을 지웠어요.')});
function randInt(max){if(globalThis.crypto&&crypto.getRandomValues){let arr=new Uint32Array(1),range=0x100000000,limit=Math.floor(range/max)*max,x;do{crypto.getRandomValues(arr);x=arr[0]}while(x>=limit);return x%max}return Math.floor(Math.random()*max)}
let audioCtx;function beep(freq=550,duration=.05){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.04,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function setSound(){const el=$('soundBtn');el.textContent=sound?'🔊 효과음 켜짐':'🔇 효과음 꺼짐';el.setAttribute('aria-pressed',String(sound));save()};$('soundBtn').addEventListener('click',()=>{sound=!sound;setSound();if(sound)beep()});setSound();
function celebrate(){const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let bits=Array.from({length:135},()=>({x:Math.random()*innerWidth,y:-Math.random()*innerHeight*.5-10,v:2+Math.random()*5,drift:(Math.random()-.5)*3,a:Math.random()*6.28,w:4+Math.random()*6,h:5+Math.random()*9,col:colors[randInt(colors.length)]}));let t0=performance.now();function frame(t){x.clearRect(0,0,innerWidth,innerHeight);for(const p of bits){p.x+=p.drift;p.y+=p.v;p.a+=.05;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}if(t-t0<3300)requestAnimationFrame(frame);else x.clearRect(0,0,innerWidth,innerHeight)}requestAnimationFrame(frame)}
$('spinBtn').addEventListener('click',()=>{if(spinning||names.length<2)return;spinning=true;renderNames();$('spinBtn').textContent='🌀 두근두근...';$('resultName').textContent='추첨 중...';$('resultDesc').textContent='과연 누구일까요?';const idx=randInt(names.length),step=2*Math.PI/names.length,start=rotation;const cur=((start%(2*Math.PI))+2*Math.PI)%(2*Math.PI),dest=((2*Math.PI-(idx*step)%(2*Math.PI))%(2*Math.PI)),delta=(dest-cur+2*Math.PI)%(2*Math.PI),target=start+2*Math.PI*(5+randInt(3))+delta,duration=4400;let st=null,prevTick=-1;function animate(ts){if(st===null)st=ts;const p=Math.min(1,(ts-st)/duration),ease=1-Math.pow(1-p,4);rotation=start+(target-start)*ease;draw(rotation);let tick=Math.floor((rotation-start)/step);if(tick!==prevTick&&p<.9){prevTick=tick;beep(420+Math.min(350,p*300),.024)}if(p<1){requestAnimationFrame(animate)}else{rotation=dest;draw();spinning=false;renderNames();$('spinBtn').textContent='🎲 다시 돌리기';const winner=names[idx];$('resultName').textContent='🎉 '+safeText(winner)+' 님!';$('resultDesc').textContent='오늘 점심 계산 담당으로 선정되셨습니다!';let date=new Date();history.unshift({name:winner,date:date.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})});history=history.slice(0,15);renderHistory();save();beep(740,.16);setTimeout(()=>beep(1000,.25),180);celebrate()}}requestAnimationFrame(animate)});
refresh();
})();
</script>
</body>
</html>
